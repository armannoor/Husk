name: Translation layer on macOS

# The translation layer is ordinary C that runs on arm64 XNU. An Apple Silicon
# macOS runner has the same 16 KiB pages, MAP_JIT and thread pointer the phone
# has, so the loader, the ELF mapping, the JNI bridge and the Dalvik
# interpreter can be built and driven here before an IPA exists.
#
# What this proves: the layer compiles for iOS and runs an APK end to end on a
# Mac. What it cannot prove: Metal/UIKit presentation, entitlements, and
# anything that needs a real device (see docs/04-translation-layer.md).

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      apk_urls:
        description: "Extra APK URLs, one per line (optional)"
        required: false
        type: string
      seconds:
        description: "Seconds to run each APK"
        required: false
        default: "8"

concurrency:
  group: tl-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Build and run the layer (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          clang --version
          python3 --version

      - name: Build the attempt harness and the scanner
        run: |
          set -eux
          OUT="$RUNNER_TEMP/tl"
          mkdir -p "$OUT"
          SRC=src/translation-layer
          # Every file under src/translation-layer is Husk's own runtime; the
          # harness supplies the Mach side (tests/translation-layer/attempt_host.c).
          clang -arch arm64 -O1 -g -Wall -Wno-unused-parameter -o "$OUT/attempt_host" \
            tests/translation-layer/attempt_host.c \
            tests/translation-layer/host_audio_stub.c \
            "$SRC"/*.c \
            -I "$SRC" -lz \
            -framework Foundation -framework CoreGraphics -framework ImageIO \
            -framework AudioToolbox
          clang -arch arm64 -O1 -g -o "$OUT/scan_cli" \
            tests/translation-layer/scan_cli.c \
            tests/translation-layer/host_audio_stub.c \
            "$SRC"/husk-tl-json.c "$SRC"/husk-tl-zip.c "$SRC"/husk-tl-elf.c \
            "$SRC"/husk-tl-scan.c "$SRC"/husk-tl-probe.c \
            -I "$SRC" -lz
          "$OUT/scan_cli" 2>&1 | head -20 || true

      - name: Fetch open-source APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/apks"
          cd "$RUNNER_TEMP/apks"
          curl -fsSL --retry 3 -o fdroid.apk https://f-droid.org/F-Droid.apk
          # Termux: a Java activity around a large arm64 native library, so it
          # exercises the ELF loader and the bionic shim as well as the DVM.
          # The API is rate-limited on shared runner IPs; the token raises the
          # limit, and the pinned asset is the fallback if it still refuses.
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                https://api.github.com/repos/termux/termux-app/releases/latest \
                | python3 -c 'import json,sys; a=json.load(sys.stdin)["assets"]; print(next(x["browser_download_url"] for x in a if "arm64-v8a" in x["name"] and x["name"].endswith(".apk")))' \
                || true)
          if [ -z "$url" ]; then
            url='https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_arm64-v8a.apk'
          fi
          curl -fsSL --retry 3 -o termux.apk "$url"
          ls -l

      - name: Extra APKs from the workflow input
        if: ${{ inputs.apk_urls != '' }}
        env:
          APK_URLS: ${{ inputs.apk_urls }}
        run: |
          set -eux
          cd "$RUNNER_TEMP/apks"
          i=0
          printf '%s\n' "$APK_URLS" | while IFS= read -r u; do
            [ -n "$u" ] || continue
            i=$((i+1))
            curl -fsSL --retry 3 -o "extra-$i.apk" "$u"
          done
          ls -l

      - name: Scan every APK
        run: |
          set -ux
          OUT="$RUNNER_TEMP/tl"
          mkdir -p "$RUNNER_TEMP/report"
          for apk in "$RUNNER_TEMP"/apks/*.apk; do
            name=$(basename "$apk")
            echo "=== $name" | tee -a "$RUNNER_TEMP/report/scan.txt"
            "$OUT/scan_cli" scan "$apk" > "$RUNNER_TEMP/report/$name.scan.json" 2>&1 || true
            python3 - "$RUNNER_TEMP/report/$name.scan.json" <<'PY' | tee -a "$RUNNER_TEMP/report/scan.txt"
          import json, sys
          try:
              j = json.load(open(sys.argv[1]))
          except Exception as e:
              print("  unreadable:", e)
              sys.exit(0)
          if not isinstance(j, dict):
              print("  unexpected:", type(j).__name__)
              sys.exit(0)
          print("  engine=%s dex=%s abis=%s verdict=%s"
                % (j.get("engine"), j.get("dexCount"), j.get("abis"), j.get("verdict")))
          PY
          done

      - name: Run every APK through the layer
        run: |
          set -ux
          OUT="$RUNNER_TEMP/tl"
          SECS="${{ inputs.seconds }}"
          SECS="${SECS:-8}"
          mkdir -p "$RUNNER_TEMP/report"
          for apk in "$RUNNER_TEMP"/apks/*.apk; do
            name=$(basename "$apk")
            echo "=== $name" | tee -a "$RUNNER_TEMP/report/run.txt"
            "$OUT/attempt_host" "$apk" "$SECS" > "$RUNNER_TEMP/report/$name.log" 2>&1
            rc=$?
            echo "  exit=$rc" | tee -a "$RUNNER_TEMP/report/run.txt"
            tail -25 "$RUNNER_TEMP/report/$name.log" | tee -a "$RUNNER_TEMP/report/run.txt"
          done
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tl-macos-report
          path: ${{ runner.temp }}/report
          if-no-files-found: warn

  ios-compile:
    name: Compile for iOS (arm64)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile every translation-layer source for the device SDK
        run: |
          set -eux
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TARGET=arm64-apple-ios15.5
          mkdir -p "$RUNNER_TEMP/obj"
          for f in src/translation-layer/*.c src/translation-layer/*.m \
                   src/translation-layer-next/*.c src/translation-layer-next/*.m; do
            [ -e "$f" ] || continue
            o="$RUNNER_TEMP/obj/$(basename "$f").o"
            clang -target "$TARGET" -isysroot "$SDK" -O0 -g0 -c "$f" -o "$o" \
              -I src/translation-layer -I src/translation-layer-next \
              -fobjc-arc -Wno-deprecated-declarations
          done
          echo "compiled $(ls "$RUNNER_TEMP/obj" | wc -l) objects"

  framework:
    name: Build the Java framework and check API coverage
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build husk-framework.dex
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/build"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/r8.jar" \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.5.35/r8-8.5.35.jar
          HUSK_JDK="$JAVA_HOME" HUSK_D8="$RUNNER_TEMP/r8.jar" \
            src/java-framework/build.sh "$RUNNER_TEMP/build/husk-framework.dex"
          ls -l "$RUNNER_TEMP/build"

      - name: Fetch the reference runtime and sample APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/apks"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/Husk.ipa" \
            https://github.com/Leviidev/Husk/releases/download/3.3/Husk.ipa
          unzip -q "$RUNNER_TEMP/Husk.ipa" 'Payload/Husk.app/java-runtime/*' -d "$RUNNER_TEMP/ipa"
          mv "$RUNNER_TEMP/ipa/Payload/Husk.app/java-runtime" "$RUNNER_TEMP/java-runtime"
          cd "$RUNNER_TEMP/apks"
          curl -fsSL --retry 3 -o fdroid.apk https://f-droid.org/F-Droid.apk
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                https://api.github.com/repos/termux/termux-app/releases/latest \
                | python3 -c 'import json,sys; a=json.load(sys.stdin)["assets"]; print(next(x["browser_download_url"] for x in a if "arm64-v8a" in x["name"] and x["name"].endswith(".apk")))' \
                || true)
          if [ -z "$url" ]; then
            url='https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_arm64-v8a.apk'
          fi
          curl -fsSL --retry 3 -o termux.apk "$url"
          # NewPipe: a large pure-Java/Media3 app, no native code of its own, so it exercises
          # Activity + fragments + media sessions without the ELF loader in the way.
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                https://api.github.com/repos/TeamNewPipe/NewPipe/releases/latest \
                | python3 -c 'import json,sys; a=json.load(sys.stdin)["assets"]; print(next(x["browser_download_url"] for x in a if x["name"].startswith("NewPipe_") and x["name"].endswith(".apk")))' \
                || true)
          if [ -n "$url" ]; then
            curl -fsSL --retry 3 -o newpipe.apk "$url" || rm -f newpipe.apk
          fi
          ls -l

      - name: Fetch the private Ren'Py test APK
        env:
          TL_ASSETS_DEPLOY_KEY: ${{ secrets.TL_ASSETS_DEPLOY_KEY }}
        run: |
          set -eux
          if [ -z "${TL_ASSETS_DEPLOY_KEY:-}" ]; then
            echo "TL_ASSETS_DEPLOY_KEY is not set; skipping the Ren'Py run"
            exit 0
          fi
          printf '%s\n' "$TL_ASSETS_DEPLOY_KEY" > "$RUNNER_TEMP/tl-assets-key"
          chmod 600 "$RUNNER_TEMP/tl-assets-key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tl-assets-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            git clone --depth 1 git@github.com:armannoor/husk-tl-assets.git "$RUNNER_TEMP/tl-assets"
          cp "$RUNNER_TEMP/tl-assets/Shattered Minds_1.0_tl.apk" "$RUNNER_TEMP/apks/renpy-test.apk"

      - name: Framework API coverage
        run: |
          set -eux
          python3 tools/compat/framework-gap.py --boot "$RUNNER_TEMP/java-runtime" \
            --framework "$RUNNER_TEMP/build/husk-framework.dex" \
            "$RUNNER_TEMP"/apks/*.apk | tee "$RUNNER_TEMP/framework-gap.txt"

      - name: Test the Ren'Py preparePython contract
        run: |
          set -eux
          python3 tools/make-fake-renpy-apk.py "$RUNNER_TEMP/renpy-fake.apk" "$RUNNER_TEMP/plain.apk" 3.12
          python3 tools/make-fake-renpy-apk.py "$RUNNER_TEMP/renpy-fake27.apk" "$RUNNER_TEMP/plain27.apk" 2.7
          clang -arch arm64 -O1 -g -o "$RUNNER_TEMP/renpy-prepare-test" \
            tools/renpy-prepare-test.c src/translation-layer-next/husk-tl-python.c \
            src/translation-layer/husk-tl-zip.c \
            -I src/translation-layer-next -I src/translation-layer -lz
          "$RUNNER_TEMP/renpy-prepare-test" "$RUNNER_TEMP/renpy-fake.apk" "$RUNNER_TEMP/renpy-data" 3.12
          "$RUNNER_TEMP/renpy-prepare-test" "$RUNNER_TEMP/renpy-fake27.apk" "$RUNNER_TEMP/renpy-data27" 2.7

      - name: Build the Java-app harness
        continue-on-error: true
        run: |
          set -eux
          OUT="$RUNNER_TEMP/tl"; mkdir -p "$OUT"
          clang -arch arm64 -O1 -g -o "$OUT/javaapp-test" \
            -DTL_HAVE_LOG_SINK=1 \
            tools/javaapp-test.c tests/translation-layer/host_audio_stub.c \
            src/translation-layer/*.c \
            src/translation-layer-next/*.c src/translation-layer-next/*.m \
            -I src/translation-layer-next -I src/translation-layer \
            -fobjc-arc -lz -lsqlite3 -lresolv \
            -framework Foundation -framework CoreFoundation -framework CoreGraphics \
            -framework CoreText -framework ImageIO -framework AudioToolbox \
            -framework Security -framework Metal -framework QuartzCore \
            -framework AppKit -framework WebKit -framework IOKit -framework CoreServices \
            -framework CoreMedia -framework CoreVideo -framework VideoToolbox -framework Accelerate

      - name: Run the Java apps on the Dalvik runtime
        continue-on-error: true
        run: |
          set -ux
          set +e
          OUT="$RUNNER_TEMP/tl"
          ART="$RUNNER_TEMP/java-runtime/com.android.art"
          mkdir -p "$RUNNER_TEMP/jdata"
          for apk in "$RUNNER_TEMP"/apks/*.apk; do
            name=$(basename "$apk")
            secs=20
            case "$name" in *renpy-test*) secs=60 ;; esac
            case "$name" in
              *renpy-test*)
                mkdir -p "$RUNNER_TEMP/jdata/$name/files"
                cp tools/renpy-sitecustomize.py "$RUNNER_TEMP/jdata/$name/files/sitecustomize.py"
                cp tools/renpy-environment.txt "$RUNNER_TEMP/jdata/$name/files/environment.txt"
                ;;
            esac
            echo "=== $name" | tee -a "$RUNNER_TEMP/javaapp.txt"
            TL_ART="$ART" \
            TL_FRAMEWORK="$RUNNER_TEMP/build/husk-framework.dex" \
            TL_FRAMEWORK_RES="$RUNNER_TEMP/java-runtime/framework-res.apk" \
            TL_TMP="$RUNNER_TEMP/jdata" TL_DATA="$RUNNER_TEMP/jdata/$name" \
              perl -e 'alarm 120; exec @ARGV' "$OUT/javaapp-test" "$apk" "$secs" > "$RUNNER_TEMP/$name.javaapp.log" 2>&1
            rc=$?
            echo "  exit=$rc" | tee -a "$RUNNER_TEMP/javaapp.txt"
            tail -30 "$RUNNER_TEMP/$name.javaapp.log" | tee -a "$RUNNER_TEMP/javaapp.txt"
          done

      - name: Collect the guest Ren'Py logs
        if: always()
        run: |
          set -ux
          : > "$RUNNER_TEMP/guest-renpy.log"
          find "$RUNNER_TEMP/jdata" -type f \( -name 'log*.txt' -o -name 'traceback.txt' \) -print -exec sh -c 'echo "----- $1"; cat "$1"' _ {} \; >> "$RUNNER_TEMP/guest-renpy.log" 2>&1 || true
          echo "===== data tree" >> "$RUNNER_TEMP/guest-renpy.log"
          find "$RUNNER_TEMP/jdata" -maxdepth 7 -type d >> "$RUNNER_TEMP/guest-renpy.log" 2>&1 || true
          wc -c "$RUNNER_TEMP/guest-renpy.log"

      - name: Upload the framework and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: husk-framework
          path: |
            ${{ runner.temp }}/build/husk-framework.dex
            ${{ runner.temp }}/framework-gap.txt
            ${{ runner.temp }}/javaapp.txt
            ${{ runner.temp }}/guest-renpy.log
            ${{ runner.temp }}/*.javaapp.log
          if-no-files-found: warn
